<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Snail Derby featured icon, dark: black ground, cream snail -->
  <rect x="0" y="0" width="1920" height="1080" fill="#000000"/>
  <!-- finish line, full height -->
  <g fill="#FFFEEA">
    <rect x="1200" y="0" width="80" height="1080"/>
    <rect x="1360" y="80" width="80" height="920"/>
  </g>
  <!-- ground-colour outline so the snail reads over the finish line -->
  <g fill="#000000" stroke="#000000" stroke-linecap="round">
    <rect x="560" y="700" width="760" height="130" rx="65" stroke-width="30"/>
    <line x1="1230" y1="715" x2="1262" y2="655" stroke-width="190"/>
    <circle cx="1252" cy="600" r="82" stroke-width="30"/>
    <line x1="1222" y1="552" x2="1190" y2="448" stroke-width="90"/>
    <line x1="1288" y1="552" x2="1320" y2="448" stroke-width="90"/>
    <circle cx="1190" cy="448" r="24" stroke-width="30"/>
    <circle cx="1320" cy="448" r="24" stroke-width="30"/>
  </g>
  <!-- snail: foot, neck, head -->
  <g fill="#FFFEEA">
    <rect x="560" y="700" width="760" height="130" rx="65"/>
    <circle cx="1252" cy="600" r="82"/>
    <circle cx="1190" cy="448" r="24"/>
    <circle cx="1320" cy="448" r="24"/>
  </g>
  <line x1="1230" y1="715" x2="1262" y2="655" stroke="#FFFEEA" stroke-width="130" stroke-linecap="round"/>
  <!-- eye stalks -->
  <g stroke="#FFFEEA" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="1222" y1="552" x2="1190" y2="448"/>
    <line x1="1288" y1="552" x2="1320" y2="448"/>
  </g>
  <!-- shell with racing roundel -->
  <circle cx="860" cy="500" r="250" fill="#FFFEEA"/>
  <circle cx="860" cy="500" r="160" fill="#000000"/>
  <circle cx="860" cy="500" r="130" fill="#FFEE6F"/>
</svg>
